---
- name: Read the root file system type
  ansible.builtin.command: findmnt -no FSTYPE /
  register: readonly_rootfs
  changed_when: false
  check_mode: false

- name: Read the configured kernel command line
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: readonly_cmdline

- name: Read fstab
  ansible.builtin.slurp:
    src: /etc/fstab
  register: readonly_fstab

- name: Set overlay facts
  ansible.builtin.set_fact:
    readonly_overlay_active: "{{ readonly_rootfs.stdout == 'overlay' }}"
    readonly_overlay_configured: "{{ 'overlayroot=tmpfs' in (readonly_cmdline.content | b64decode) }}"
    readonly_bootro_configured: >-
      {{ (readonly_fstab.content | b64decode).splitlines()
         | select('search', '/boot/firmware\s.*defaults.*,ro[ ,]') | list | length > 0 }}
