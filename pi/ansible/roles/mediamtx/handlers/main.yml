---
- name: Restart mediamtx
  ansible.builtin.systemd_service:
    name: mediamtx.service
    state: restarted
    daemon_reload: true
  when: birdmic_mode == 'serve'

- name: Restart birdmic-push
  ansible.builtin.systemd_service:
    name: birdmic-push.service
    state: restarted
    daemon_reload: true
  when: birdmic_mode == 'push'
