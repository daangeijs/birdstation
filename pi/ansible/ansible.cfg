[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = pi
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false
# Pi 2: fact gathering is slow, cache it for the session only
gathering = smart
fact_caching = memory

[privilege_escalation]
become = true

[ssh_connection]
pipelining = true
