# Example only: copy to secret.yaml (git-ignored), fill in, and apply it
# yourself before the first deploy. It is not part of kustomization.yaml, so
# secrets never end up in git.
#
#   cp secret.example.yaml secret.yaml && $EDITOR secret.yaml
#   kubectl apply -f secret.yaml
#
# Or without a file:
#
#   kubectl -n birdnet-go create secret generic birdnet-go-env \
#     --from-literal=RTSP_URL=rtsp://birdmic.example.lan:8554/mic \
#     --from-literal=MQTT_PASSWORD='<your MQTT password>'
#
# An External Secrets Operator ExternalSecret that produces the same two keys
# works just as well.
apiVersion: v1
kind: Secret
metadata:
  name: birdnet-go-env
  namespace: birdnet-go
type: Opaque
stringData:
  # The Pi's stream. Later this can carry credentials or use rtsps://; no
  # manifest change needed.
  RTSP_URL: rtsp://birdmic.example.lan:8554/mic
  # Password of the MQTT user set in config.yaml (realtime.mqtt.username).
  MQTT_PASSWORD: CHANGE_ME
