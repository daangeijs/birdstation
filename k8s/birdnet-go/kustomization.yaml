apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: birdnet-go

# The Secret birdnet-go-env is created separately: see secret.example.yaml.
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# config.yaml becomes a ConfigMap with a content hash in its name, so any
# edit to it rolls the Deployment.
configMapGenerator:
  - name: birdnet-go-config
    files:
      - config.yaml
